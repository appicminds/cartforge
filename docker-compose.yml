# Local development dependencies. Production compose lives in infrastructure/docker (Next 10).
name: cartforge-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cartforge
      POSTGRES_PASSWORD: cartforge
      POSTGRES_DB: cartforge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartforge"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cartforge
      MINIO_ROOT_PASSWORD: cartforge-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  redisdata:
  miniodata:
